services:
  - type: web
    name: sancaulongnienthoi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Don't use healthCheckPath on homepage - it may fail during cold start
    # healthCheckPath: /
    disk:
      name: storage
      mountPath: /var/www/html/storage/app
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: "Sân cầu lông Niên Thời"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: vi
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_STRICT
        value: "false"
      - key: FORCE_SCHEMA
        value: https
      - key: FORCE_ROOT_URL
        sync: false
      - key: ENABLE_HTTPS_SUPPORT
        value: "true"
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_DIR
        value: admin
      - key: CMS_ENABLE_INSTALLER
        value: "false"
      - key: FILESYSTEM_DISK
        value: s3
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # S3 vars - set manually in Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_URL
        sync: false
